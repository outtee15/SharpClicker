[package]
name = "sharpclicker"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = "0.29"
enigo = "0.2"
device_query = "2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true